<h3>Controle de Estoque</h3>

<div>
  <label>Alterar Nome do Produto: </label>
  <input [(ngModel)]="nomeProduto" />
</div>

<hr>

<p>Produto: <strong>{{ nomeProduto }}</strong></p>
<p>Quantidade em estoque: {{ estoque }}</p>

<button (click)="remover()" [disabled]="estoque === 0">-</button>
<button (click)="adicionar()">+</button>
