<h2>Produtos</h2>

<div *ngFor="let produto of produtos; let i = index">

  <h3>Produto {{ i + 1 }}</h3>

  <p>Nome: {{ produto.nome }}</p>

  <p>Preço: {{ produto.preco | currency:'BRL' }}</p>

  <p>Quantidade disponível: {{ produto.quantidade }}</p>

  <p>
    Valor total em estoque:
    {{ produto.preco * produto.quantidade | currency:'BRL' }}
  </p>

</div>
