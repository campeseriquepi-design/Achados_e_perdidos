<h2>Classificação dos produtos</h2>

<div
  *ngFor="let produto of produtos"
  [ngClass]="{
    'cor-vermelho': produto.quantidade === 0,
    'cor-amarelo': produto.quantidade >= 1 && produto.quantidade <= 5,
    'cor-verde': produto.quantidade > 5
  }"
>

  <h3>{{ produto.nome }}</h3>

  <p>Quantidade: {{ produto.quantidade }}</p>

  <p *ngIf="produto.quantidade === 0">Sem estoque.</p>
  <p *ngIf="produto.quantidade >= 1 && produto.quantidade <= 5">Estoque baixo.</p>
  <p *ngIf="produto.quantidade > 5">Estoque disponível.</p>

</div>
